<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メンタルヘルスブログ | メンテナンス中</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="maintenance-wrap">
      <section class="maintenance-card" aria-live="polite">
        <div class="badge">メンテナンス中</div>
        <h1>現在、サイトはメンテナンス中です</h1>
        <p class="subtitle">
          心理的なケアやメンタルヘルスに関する情報の更新を準備しており、
          現在は一時的に記事の公開を停止しています。<br />
          ご迷惑をおかけしますが、もうしばらくお待ちください。
        </p>

        <div class="info-box">
          <strong>再開予定:</strong> 近日更新予定<br />
          <strong>状況:</strong> サイト改善とコンテンツ準備を進めています
        </div>

        <div class="button-row" aria-hidden="true">
          <a class="button primary" href="mailto:hello@example.com">お問い合わせ</a>
          <a class="button secondary" href="https://github.com" target="_blank" rel="noreferrer">復旧状況を確認</a>
        </div>
      </section>
    </main>
  </body>
</html>
