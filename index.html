<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メンタルヘルスブログ | メンテナンス中</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: rgba(255, 255, 255, 0.9);
        --primary: #4f7cff;
        --primary-dark: #3359d6;
        --accent: #fff3d6;
        --text: #1f2a37;
        --muted: #5d6b7a;
        --border: rgba(79, 124, 255, 0.15);
        --shadow: 0 24px 60px rgba(30, 41, 59, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(79, 124, 255, 0.18), transparent 35%),
          radial-gradient(circle at bottom right, rgba(117, 201, 181, 0.18), transparent 30%),
          var(--bg);
        color: var(--text);
      }

      .maintenance-wrap {
        width: min(92vw, 760px);
      }

      .maintenance-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: clamp(2rem, 4vw, 4rem);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        background: var(--accent);
        color: #8d5b00;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }

      .badge::before {
        content: "⚠";
        font-size: 1.1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 5vw, 4rem);
        line-height: 1.15;
        letter-spacing: 0.04em;
      }

      .subtitle {
        margin: 1rem auto 0;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.8;
        color: var(--muted);
        max-width: 540px;
      }

      .info-box {
        margin-top: 2rem;
        padding: 1.1rem 1.3rem;
        border-radius: 16px;
        background: rgba(79, 124, 255, 0.06);
        border: 1px solid rgba(79, 124, 255, 0.12);
        color: var(--text);
      }

      .info-box strong {
        color: var(--primary-dark);
      }

      .button-row {
        display: none;
      }

      .button {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="maintenance-wrap">
      <section class="maintenance-card" aria-live="polite">
        <div class="badge">メンテナンス中</div>
        <h1>現在、サイトはメンテナンス中です</h1>
        <p class="subtitle">
          心理的なケアやメンタルヘルスに関する情報の更新を準備しており、
          現在は一時的に記事の公開を停止しています。<br />
          ご迷惑をおかけしますが、もうしばらくお待ちください。
        </p>

        <div class="info-box">
          <strong>再開予定:</strong> 近日更新予定<br />
          <strong>状況:</strong> サイト改善とコンテンツ準備を進めています
        </div>

        <div class="button-row" aria-hidden="true">
          <a class="button primary" href="mailto:hello@example.com">お問い合わせ</a>
          <a class="button secondary" href="https://github.com" target="_blank" rel="noreferrer">復旧状況を確認</a>
        </div>
      </section>
    </main>
  </body>
</html>
